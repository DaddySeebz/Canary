    <div id="root"></div>

    <!-- shared primitives -->
    <script type="text/babel" data-presets="react">
// ─── shared.jsx ────────────────────────────────────────────────────────────

function CanaryMark({ size = 20 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true" style={{ display: "block" }}>
      <rect x="3.5" y="3.5" width="17" height="17" rx="3" stroke="currentColor" strokeWidth="1.5" opacity="0.35" />
      <rect x="8" y="8" width="8" height="8" rx="1.5" fill="currentColor" />
    </svg>
  );
}

function Wordmark({ tagline = false, inkColor = "var(--ink)", size = 28 }) {
  if (typeof window !== "undefined" && window.CanaryLogoV2) {
    return (
      <window.CanaryLogoV2
        size={size}
        withWordmark
        tagline={tagline}
        inkColor={inkColor}
        faintColor="var(--ink-faint)"
      />
    );
  }
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, color: "var(--amber)" }}>
      <CanaryMark size={18} />
      <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
        <span style={{ fontFamily: "Space Grotesk, sans-serif", fontWeight: 600, fontSize: 15, letterSpacing: "0.01em", color: inkColor }}>Canary</span>
        {tagline ? <span className="mono" style={{ fontSize: 10, color: "var(--ink-faint)", letterSpacing: "0.04em" }}>v2.4</span> : null}
      </div>
    </div>
  );
}

function CanaryNav({ cta = "Start your first audit", variant = "default" }) {
  const links = ["Product", "Monitoring", "Intelligence", "Alerting", "Docs"];
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: variant === "tight" ? "18px 40px" : "22px 48px", borderBottom: "1px solid var(--line)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 40 }}>
        <Wordmark />
        <nav style={{ display: "flex", gap: 26 }}>
          {links.map((l) => <a key={l} href="#" style={{ fontSize: 13, color: "var(--ink-dim)", fontWeight: 500 }}>{l}</a>)}
        </nav>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
        <a href="#" style={{ fontSize: 13, color: "var(--ink-dim)" }}>Log in</a>
        <button style={{ background: "var(--amber)", color: "#18120a", border: "none", borderRadius: 8, padding: "9px 16px", fontSize: 13, fontWeight: 600, letterSpacing: "-0.005em" }}>{cta}</button>
      </div>
    </div>
  );
}

function Dot({ color = "var(--amber)", size = 6 }) {
  return <span style={{ display: "inline-block", width: size, height: size, borderRadius: "50%", background: color, flexShrink: 0 }} />;
}

function CTAButton({ children, primary = true, size = "md" }) {
  const pad = size === "lg" ? "14px 22px" : size === "sm" ? "7px 13px" : "11px 18px";
  const fs = size === "lg" ? 14 : size === "sm" ? 12 : 13;
  return (
    <button style={{ background: primary ? "var(--amber)" : "transparent", color: primary ? "#18120a" : "var(--ink)", border: primary ? "none" : "1px solid var(--line-strong)", borderRadius: 8, padding: pad, fontSize: fs, fontWeight: 600, letterSpacing: "-0.005em", display: "inline-flex", alignItems: "center", gap: 8 }}>
      {children}
    </button>
  );
}

function ImageSlot({ label = "product shot", height = 200, ratio }) {
  return (
    <div style={{ position: "relative", width: "100%", height: ratio ? undefined : height, aspectRatio: ratio, background: "repeating-linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.03) 8px, transparent 8px, transparent 16px)", border: "1px solid var(--line)", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <span className="mono" style={{ fontSize: 11, color: "var(--ink-faint)", letterSpacing: "0.04em" }}>{label}</span>
    </div>
  );
}

function ArrowR({ size = 12 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M3 8h10m0 0L9 4m4 4l-4 4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function UploadIcon({ size = 14 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M8 11V3m0 0L4.5 6.5M8 3l3.5 3.5M3 12v1.5h10V12" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function PlusIcon({ size = 12 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M8 3v10M3 8h10" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" />
    </svg>
  );
}

Object.assign(window, { CanaryMark, Wordmark, CanaryNav, Dot, CTAButton, ImageSlot, ArrowR, UploadIcon, PlusIcon });
    </script>

    <!-- logo components -->
    <script type="text/babel" data-presets="react">
// ─── canary-logo.jsx ────────────────────────────────────────────────────────

const R = (typeof window !== "undefined" && window.__resources) || {};
const BRAND = {
  iconGold:       R.iconGold       || "brand/canary-icon-gold.png",
  iconGoldFlat:   R.iconGoldFlat   || "brand/canary-icon-gold-flat.png",
  iconWhite:      R.iconWhite      || "brand/canary-icon-white.png",
  iconBlack:      R.iconBlack      || "brand/canary-icon-black.png",
  wordmarkWhite:  R.wordmarkWhite  || "brand/canary-wordmark-white.png",
  wordmarkGold:   R.wordmarkGold   || "brand/canary-wordmark-gold.png",
  wordmarkBlack:  R.wordmarkBlack  || "brand/canary-wordmark-black.png",
  horizontalDark: R.horizontalDark || "brand/canary-horizontal-light.png",
  stacked:        R.stacked        || "brand/canary-stacked.png",
};

function CanaryIcon({ size = 48, variant = "gold" }) {
  const src =
    variant === "white" ? BRAND.iconWhite :
    variant === "black" ? BRAND.iconBlack :
    variant === "flat"  ? BRAND.iconGoldFlat :
    BRAND.iconGold;
  return <img src={src} alt="Canary" width={size} height={size} style={{ width: size, height: size, objectFit: "contain", display: "block", flexShrink: 0 }} />;
}

function CanaryWordmarkImg({ height = 20, variant = "white" }) {
  const src =
    variant === "gold"  ? BRAND.wordmarkGold :
    variant === "black" ? BRAND.wordmarkBlack :
    BRAND.wordmarkWhite;
  return <img src={src} alt="Canary" height={height} style={{ height, width: "auto", display: "block" }} />;
}
